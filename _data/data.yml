career-profile:
    title: Brief Introduction
    summary: |
        Hi, welcome to my homepage! I am Yan Li/李炎. I received my PhD degree in Computer Software and Theory from [Software Engineering Institue](http://www.sei.pku.edu.cn), 
        [School of Computer Science](http://cs.pku.edu.cn), [Peking University](https://pku.edu.cn). 
        Currently, I am a Staff Engineer at BAAI (Beijing Academy of Artificial Intelligence, 北京智源人工智能研究院). My research mainly focuses on 
        large-scale AI systems, performance optimization of LLM/VLM inference systems, heterogenous systems, model-system co-design, etc.

